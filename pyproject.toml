[build-system]
requires = ["maturin>=1.16.0,<2.0"]
build-backend = "maturin"

[project]
name = "llm_guardrails"
dynamic = ["version"]
description = "Responsible AI toolkit for LLM applications -- Rust-powered PII redaction, prompt injection detection, bias scoring, and output validation with Python bindings."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Melroy Anthony" },
]
keywords = ["llm", "guardrails", "responsible-ai", "pii", "gdpr", "safety", "rust", "pyo3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.54.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.4,<1.0",
]

[project.urls]
Repository = "https://github.com/melroyanthony/llm-guardrails"

[tool.maturin]
module-name = "llm_guardrails._core"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
    ".claude",
    "scripts/release_subject.py",
    "scripts/release_publish.py",
]

[tool.ruff.lint.per-file-ignores]
"scripts/test_guardrails.py" = ["S603", "S607"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
