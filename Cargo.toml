[package]
name = "llm-guardrails-core"
version = "0.3.7"
edition = "2021"
license = "MIT"
authors = ["Melroy Anthony"]
repository = "https://github.com/melroyanthony/llm-guardrails"
description = "High-performance Rust core for the LLM Guardrails toolkit"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
regex = "1"
once_cell = "1"
serde_json = "1"
unicode-normalization = "0.1.26"
