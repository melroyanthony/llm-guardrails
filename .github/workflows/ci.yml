name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Read Rust channel
        id: rust-channel
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          if [[ ! "$channel" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "rust-toolchain.toml channel is missing or invalid: ${channel:-<empty>}" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Sync the locked environment
        # --all-extras is the api extra. pytest and ruff are the default dev group.
        run: uv sync --locked --all-extras

      - name: Ruff
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy llm_guardrails

      - name: Pytest
        run: uv run pytest

      - name: Release and harness self-tests
        run: |
          python3 scripts/release_subject.py --self-test
          python3 scripts/release_publish.py --self-test
          python3 scripts/release_recover.py --self-test
          python3 scripts/release_sbom.py --self-test
          python3 scripts/test_guardrails.py

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Rust channel
        id: rust-channel
        run: |
          channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
          if [[ ! "$channel" =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "rust-toolchain.toml channel is missing or invalid: ${channel:-<empty>}" >&2
            exit 1
          fi
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.rust-channel.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  wheel:
    name: Wheel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      # Same action, target, manylinux setting, and args as the release
      # linux-x86_64 matrix row. `manylinux: auto` builds in the
      # manylinux2014 image, so the wheel tag is manylinux_2_17.
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: x86_64
          manylinux: auto
          args: --release --out dist --interpreter python3.11

      - name: Install Python 3.14 and import the wheel
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/ferroguard-*-cp311-abi3-*manylinux_2_17_x86_64*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected one manylinux_2_17 x86_64 abi3 wheel" >&2
            ls -la dist >&2 || true
            exit 1
          fi
          case "${wheels[0]}" in
            *manylinux2014_x86_64*) ;;
            *)
              echo "missing manylinux2014_x86_64 alias: ${wheels[0]}" >&2
              exit 1
              ;;
          esac
          uv python install 3.14
          for py in 3.11 3.14; do
            uv venv --python "$py" "/tmp/smoke-$py"
            uv pip install --python "/tmp/smoke-$py/bin/python" "${wheels[0]}"
            # -P keeps the checkout off sys.path, so this imports the wheel.
            "/tmp/smoke-$py/bin/python" -P -c "import llm_guardrails; from importlib.metadata import version; from llm_guardrails._core import pii_redact; text, mapping = pii_redact('Mail a@b.co'); assert 'site-packages' in llm_guardrails.__file__; assert 'a@b.co' not in text and mapping; assert version('ferroguard'); print(version('ferroguard'), llm_guardrails.__file__, text)"
          done

  docker:
    name: Docker /health
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image stays on this runner. This job does not log in to a registry.
      - name: Build the image
        run: docker build --tag llm-guardrails:ci .

      - name: Start the container and require HTTP 200 from /health
        run: |
          set -euo pipefail
          name=llm-guardrails-ci
          docker run --detach --name "$name" --publish 127.0.0.1:8000:8000 llm-guardrails:ci
          cleanup() {
            docker logs "$name" >&2 || true
            docker rm --force "$name" >/dev/null || true
          }
          trap cleanup EXIT
          deadline=$((SECONDS + 60))
          while true; do
            running="$(docker inspect --format '{{.State.Running}}' "$name")"
            if [ "$running" != "true" ]; then
              echo "container exited before /health returned 200" >&2
              exit 1
            fi
            code="$(curl --silent --output /tmp/health-body --write-out '%{http_code}' --max-time 2 http://127.0.0.1:8000/health || true)"
            if [ "$code" = "200" ]; then
              echo "GET /health returned 200"
              exit 0
            fi
            if [ -n "$code" ] && [ "$code" != "000" ]; then
              echo "GET /health returned HTTP ${code}, expected 200" >&2
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "GET /health did not return 200 within 60s" >&2
              exit 1
            fi
            sleep 2
          done
