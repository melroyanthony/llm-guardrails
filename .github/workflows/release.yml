name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recover_tag:
        description: Existing vX.Y.Z tag to publish again. Does not create or move a tag.
        required: true
        type: string
      recover_mode:
        description: >
          sbom regenerates the SBOM from the published distributions and
          replaces an empty one. wheels rebuilds distributions only when
          PyPI did not succeed.
        required: false
        default: sbom
        type: choice
        options:
          - sbom
          - wheels

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, '🔖 chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
      tag: ${{ steps.publish.outputs.tag }}
      mode: ${{ steps.publish.outputs.mode }}
    permissions:
      contents: write
      # gh pr create for release/vX.Y.Z. This job does not push main.
      pull-requests: write
      # Dispatch ci.yml on the release branch, and list Release runs.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Open the release pull request
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release_recover.py --resolve > /tmp/recover.json
          recover_action="$(python3 -c 'import json; print(json.load(open("/tmp/recover.json"))["action"])')"
          if [ "$recover_action" = "sbom" ] || [ "$recover_action" = "recover" ]; then
            tag="$(python3 -c 'import json; print(json.load(open("/tmp/recover.json"))["tag"])')"
            mode="$(python3 scripts/release_recover.py --mode-for "$recover_action")"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "mode=${mode}" >> "$GITHUB_OUTPUT"
            if [ "$recover_action" = "sbom" ]; then
              echo "attaching the saved SBOM for ${tag}; not rebuilding wheels or creating a tag"
            else
              echo "reusing existing tag ${tag}; not creating a replacement"
            fi
            exit 0
          fi
          python3 scripts/release_subject.py \
            --decide \
            --since-tag \
            --version-file .version \
            --rev HEAD > /tmp/decision.json
          action="$(python3 -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          if [ "$action" != "publish" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "release skipped: ${action}"
            exit 0
          fi
          python3 scripts/release_publish.py open-pr --decision-file /tmp/decision.json
          action="$(python3 -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          if [ "$action" != "publish" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "release skipped after open-pr: ${action}"
            exit 0
          fi
          # _ensure_pr has opened the pull request. GITHUB_TOKEN does not
          # start pull_request workflows, so dispatch CI on that branch.
          version="$(python3 -c 'import json; print(json.load(open("/tmp/decision.json"))["version"])')"
          ref="release/v${version}"
          if git ls-remote --exit-code --heads origin "refs/heads/${ref}" >/dev/null 2>&1; then
            gh workflow run ci.yml --ref "$ref"
          else
            echo "no ${ref}; CI was not dispatched"
          fi
          # The pull request is open. Tag and PyPI wait for a person to merge it.
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "mode=skip" >> "$GITHUB_OUTPUT"

  # A person squash-merges the release pull request. This job tags that
  # commit. It does not push main, so the run does not loop. Wheels and
  # PyPI stay in this run: the tag push uses GITHUB_TOKEN and does not
  # start another workflow.
  ship:
    name: Tag the merged release
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]' && (startsWith(github.event.head_commit.message, 'chore(release):') || startsWith(github.event.head_commit.message, '🔖 chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.tag.outputs.published }}
      tag: ${{ steps.tag.outputs.tag }}
      mode: ${{ steps.tag.outputs.mode }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag the merged release commit
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release_publish.py publish-tag
          version="$(tr -d '[:space:]' < .version)"
          tag="v${version}"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "mode=wheels" >> "$GITHUB_OUTPUT"

  # Manual retry for an unfinished tag. contents: read, so this job cannot
  # create or move a tag. actions: read lists Release runs for that tag.
  # Dispatch it from main; do not invent a tag.
  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      published: ${{ steps.check.outputs.published }}
      tag: ${{ steps.check.outputs.tag }}
      mode: ${{ steps.check.outputs.mode }}
    permissions:
      contents: read
      # Lists Release runs to see whether this tag already reached PyPI.
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require the existing unfinished tag
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVER_TAG: ${{ github.event.inputs.recover_tag }}
          RECOVER_MODE: ${{ github.event.inputs.recover_mode }}
        run: |
          set -euo pipefail
          python3 scripts/release_recover.py \
            --tag "$RECOVER_TAG" \
            --expect "${RECOVER_MODE:-sbom}" > /tmp/recover.json
          action="$(python3 -c 'import json; print(json.load(open("/tmp/recover.json"))["action"])')"
          tag="$(python3 -c 'import json; print(json.load(open("/tmp/recover.json"))["tag"])')"
          mode="$(python3 scripts/release_recover.py --mode-for "$action")"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

  # One tag for the rest of the run: a new release, or the unfinished tag.
  selected:
    name: Select tag
    needs: [release, recover, ship]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.recover.result == 'success' || needs.ship.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.pick.outputs.published }}
      tag: ${{ steps.pick.outputs.tag }}
      mode: ${{ steps.pick.outputs.mode }}
    permissions:
      contents: read
    steps:
      - name: Pick the tag
        id: pick
        env:
          SHIP_PUBLISHED: ${{ needs.ship.outputs.published }}
          SHIP_TAG: ${{ needs.ship.outputs.tag }}
          SHIP_MODE: ${{ needs.ship.outputs.mode }}
          RELEASE_PUBLISHED: ${{ needs.release.outputs.published }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_MODE: ${{ needs.release.outputs.mode }}
          RECOVER_PUBLISHED: ${{ needs.recover.outputs.published }}
          RECOVER_TAG: ${{ needs.recover.outputs.tag }}
          RECOVER_MODE: ${{ needs.recover.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$SHIP_PUBLISHED" = "true" ]; then
            tag="$SHIP_TAG"
            mode="$SHIP_MODE"
          elif [ "$RELEASE_PUBLISHED" = "true" ]; then
            tag="$RELEASE_TAG"
            mode="$RELEASE_MODE"
          elif [ "$RECOVER_PUBLISHED" = "true" ]; then
            tag="$RECOVER_TAG"
            mode="$RECOVER_MODE"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing unexpected tag: $tag" >&2
            exit 1
          fi
          if [ "$mode" != "wheels" ] && [ "$mode" != "sbom" ]; then
            echo "refusing unexpected mode: $mode" >&2
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  # The tag is pushed with GITHUB_TOKEN in this run, after a person merges
  # the release pull request. A workflow that triggers on the tag never
  # starts. Wheels and PyPI stay in this run. PyPI uses trusted publishing.
  wheels:
    name: Wheel ${{ matrix.id }}
    needs: selected
    if: ${{ !cancelled() && needs.selected.result == 'success' && needs.selected.outputs.published == 'true' && needs.selected.outputs.mode == 'wheels' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            interpreter: python3.11
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            interpreter: python3.11
          - id: macos-arm64
            os: macos-latest
            target: aarch64
            interpreter: python
          - id: macos-x86_64
            os: macos-15-intel
            target: x86_64
            interpreter: python
          - id: windows-x86_64
            os: windows-latest
            target: x64
            interpreter: python
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.selected.outputs.tag }}

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
          # This job never runs uv, so the cache directory is never created.
          # setup-uv's default "auto" cache then fails the post step.
          enable-cache: false

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter ${{ matrix.interpreter }}

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.id }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: selected
    if: ${{ !cancelled() && needs.selected.result == 'success' && needs.selected.outputs.published == 'true' && needs.selected.outputs.mode == 'wheels' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.selected.outputs.tag }}

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      - name: Build the sdist
        run: uvx --from maturin==1.16.0 maturin sdist --out dist

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [selected, wheels, sdist]
    if: ${{ !cancelled() && needs.selected.result == 'success' && needs.selected.outputs.published == 'true' && needs.selected.outputs.mode == 'wheels' && needs.wheels.result == 'success' && needs.sdist.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    outputs:
      tag: ${{ needs.selected.outputs.tag }}
    permissions:
      id-token: write
      # Same-run artifact download uses the Actions API.
      actions: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Collect distributions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(path.name for path in dist.glob("*.whl"))
          sdists = sorted(path.name for path in dist.glob("*.tar.gz"))
          print("wheels:")
          print("\n".join(wheels) or "(none)")
          print("sdists:")
          print("\n".join(sdists) or "(none)")


          def one_ending(suffix: str, label: str) -> str:
              matched = [
                  name
                  for name in wheels
                  if name.startswith("ferroguard-") and name.endswith(suffix)
              ]
              if len(matched) != 1:
                  raise SystemExit(f"expected exactly one {label} wheel, found {matched}")
              return matched[0]


          # aarch64 uses the same manylinux: auto image as x86_64, so the same tags.
          linux_x64 = one_ending(
              "cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
              "linux x86_64",
          )
          linux_arm = one_ending(
              "cp311-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl",
              "linux aarch64",
          )
          mac_x64_names = [
              name
              for name in wheels
              if "-cp311-abi3-macosx_" in name and name.endswith("_x86_64.whl")
          ]
          mac_arm_names = [
              name
              for name in wheels
              if "-cp311-abi3-macosx_" in name and name.endswith("_arm64.whl")
          ]
          windows = one_ending("-cp311-abi3-win_amd64.whl", "Windows amd64")
          if len(mac_x64_names) != 1:
              raise SystemExit(f"expected exactly one macOS x86_64 wheel, found {mac_x64_names}")
          if len(mac_arm_names) != 1:
              raise SystemExit(f"expected exactly one macOS arm64 wheel, found {mac_arm_names}")
          found = {linux_x64, linux_arm, mac_x64_names[0], mac_arm_names[0], windows}
          if len(wheels) != 5 or found != set(wheels):
              raise SystemExit(f"expected exactly these 5 wheels, found {wheels}")
          if (
              len(sdists) != 1
              or not sdists[0].startswith("ferroguard-")
              or not sdists[0].endswith(".tar.gz")
          ):
              raise SystemExit(f"expected exactly one sdist, found {sdists}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  sbom:
    name: Release SBOM
    needs: [selected, pypi]
    if: ${{ !cancelled() && needs.selected.result == 'success' && needs.selected.outputs.published == 'true' && (needs.pypi.result == 'success' || needs.selected.outputs.mode == 'sbom') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      # The upload passes --repo from github.repository and is tested
      # with no checkout present.
      - name: Checkout the upload script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Syft 1.54.0
        run: |
          set -euo pipefail
          archive="syft_1.54.0_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/${archive}" \
            "https://github.com/anchore/syft/releases/download/v1.54.0/${archive}"
          echo "54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860  /tmp/${archive}" \
            | sha256sum -c
          mkdir -p "$HOME/.local/bin"
          tar -C "$HOME/.local/bin" -xzf "/tmp/${archive}" syft
          "$HOME/.local/bin/syft" version

      - name: Generate the SPDX SBOM from the published distributions
        env:
          SBOM_TAG: ${{ needs.selected.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_sbom.py \
            --generate \
            --version "${SBOM_TAG#v}" \
            --output ferroguard.spdx.json \
            --syft "$HOME/.local/bin/syft"

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SBOM_TAG: ${{ needs.selected.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/release_recover.py \
            --upload-sbom \
            --tag "$SBOM_TAG" \
            --repo "$GH_REPO" \
            --file ferroguard.spdx.json
          python3 scripts/release_sbom.py \
            --delete-invalid \
            --tag "$SBOM_TAG" \
            --repo "$GH_REPO" \
            --version "${SBOM_TAG#v}"
