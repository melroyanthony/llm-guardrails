name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):') && !startsWith(github.event.head_commit.message, '🔖 chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.publish.outputs.published }}
      tag: ${{ steps.publish.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Publish the release commit and tag
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/release_subject.py \
            --decide \
            --since-tag \
            --version-file .version \
            --rev HEAD > /tmp/decision.json
          action="$(python3 -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          if [ "$action" != "publish" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "release skipped: ${action}"
            exit 0
          fi
          python3 scripts/release_publish.py publish --decision-file /tmp/decision.json
          action="$(python3 -c 'import json; print(json.load(open("/tmp/decision.json"))["action"])')"
          if [ "$action" != "publish" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "release skipped after publish: ${action}"
            exit 0
          fi
          tag="$(python3 -c 'import json; print(json.load(open("/tmp/decision.json"))["tag"])')"
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  # The version commit is pushed with GITHUB_TOKEN, so a workflow that
  # triggers on the tag never starts. Wheels and PyPI stay in this run.
  wheels:
    name: Wheel ${{ matrix.id }}
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            os: ubuntu-latest
            target: x86_64
            interpreter: python3.11
          - id: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
            interpreter: python3.11
          - id: macos-arm64
            os: macos-latest
            target: aarch64
            interpreter: python
          - id: macos-x86_64
            os: macos-15-intel
            target: x86_64
            interpreter: python
          - id: windows-x86_64
            os: windows-latest
            target: x64
            interpreter: python
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"
          # This job never runs uv, so the cache directory is never created.
          # setup-uv's default "auto" cache then fails the post step.
          enable-cache: false

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter ${{ matrix.interpreter }}

      - name: Upload the wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.id }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.11"

      - name: Build the sdist
        run: uvx --from maturin==1.16.0 maturin sdist --out dist

      - name: Upload the sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [release, wheels, sdist]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    outputs:
      tag: ${{ needs.release.outputs.tag }}
    permissions:
      id-token: write
      # Same-run artifact download uses the Actions API.
      actions: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Collect distributions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          dist = Path("dist")
          wheels = sorted(path.name for path in dist.glob("*.whl"))
          sdists = sorted(path.name for path in dist.glob("*.tar.gz"))
          print("wheels:")
          print("\n".join(wheels) or "(none)")
          print("sdists:")
          print("\n".join(sdists) or "(none)")


          def one_ending(suffix: str, label: str) -> str:
              matched = [
                  name
                  for name in wheels
                  if name.startswith("ferroguard-") and name.endswith(suffix)
              ]
              if len(matched) != 1:
                  raise SystemExit(f"expected exactly one {label} wheel, found {matched}")
              return matched[0]


          # aarch64 uses the same manylinux: auto image as x86_64, so the same tags.
          linux_x64 = one_ending(
              "cp311-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
              "linux x86_64",
          )
          linux_arm = one_ending(
              "cp311-abi3-manylinux2014_aarch64.manylinux_2_17_aarch64.whl",
              "linux aarch64",
          )
          mac_x64_names = [
              name
              for name in wheels
              if "-cp311-abi3-macosx_" in name and name.endswith("_x86_64.whl")
          ]
          mac_arm_names = [
              name
              for name in wheels
              if "-cp311-abi3-macosx_" in name and name.endswith("_arm64.whl")
          ]
          windows = one_ending("-cp311-abi3-win_amd64.whl", "Windows amd64")
          if len(mac_x64_names) != 1:
              raise SystemExit(f"expected exactly one macOS x86_64 wheel, found {mac_x64_names}")
          if len(mac_arm_names) != 1:
              raise SystemExit(f"expected exactly one macOS arm64 wheel, found {mac_arm_names}")
          found = {linux_x64, linux_arm, mac_x64_names[0], mac_arm_names[0], windows}
          if len(wheels) != 5 or found != set(wheels):
              raise SystemExit(f"expected exactly these 5 wheels, found {wheels}")
          if (
              len(sdists) != 1
              or not sdists[0].startswith("ferroguard-")
              or not sdists[0].endswith(".tar.gz")
          ):
              raise SystemExit(f"expected exactly one sdist, found {sdists}")
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  sbom:
    name: Release SBOM
    needs: pypi
    if: needs.pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download the sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist

      - name: Generate an SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist
          format: spdx-json
          output-file: ferroguard.spdx.json

      - name: Attach the SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.pypi.outputs.tag }}" ferroguard.spdx.json --clobber
