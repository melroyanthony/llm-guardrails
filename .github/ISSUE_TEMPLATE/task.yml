name: Task or epic
description: A task, or an epic that will be split into sub-issues
title: "🔧 chore: "
labels: ["type:task"]
body:
  - type: markdown
    attributes:
      value: |
        An epic is one outcome. List the sub-issue titles below. Opening them is a separate `gh issue create` per line, then a sub-issue link. This form does not open them.
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Task
        - Epic
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What is true when this is done?
    validations:
      required: true
  - type: textarea
    id: subissues
    attributes:
      label: Sub-issues
      description: One title per line. Leave empty for a single task.
  - type: dropdown
    id: class
    attributes:
      label: Who does the work
      options:
        - AFK
        - HITL
    validations:
      required: true
