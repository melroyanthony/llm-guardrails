name: Bug Report
description: Report a bug in the SDLC Claude Code configuration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run `/orchestrate`
        2. At Stage 3...
        3. Error occurs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the config is affected?
      options:
        - Agent
        - Command
        - Skill
        - Hook
        - Rule
        - Orchestrator
        - Other
    validations:
      required: true
  - type: textarea
    id: error-output
    attributes:
      label: Error Output
      description: Paste any error messages or logs.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Claude Code version, OS, shell, etc.
      placeholder: |
        - Claude Code: v1.x
        - OS: macOS 15.x
        - Shell: zsh
